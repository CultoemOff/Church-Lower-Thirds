<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lower Third Web — overlay</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <div class="el top placed" data-el="top">
        <div class="scaler">
          <div class="box">
            <div class="part logo"><img alt="" /></div>
            <div class="part name"></div>
            <div class="part msg"><span></span></div>
            <div class="part live"><i></i><b></b></div>
            <div class="part clock">
              <div class="time"></div>
              <div class="date"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="el bug placed" data-el="bug">
        <div class="scaler">
          <div class="box"><img alt="" /></div>
        </div>
      </div>
      <div class="el card placed" data-el="card">
        <div class="scaler">
          <div class="box">
            <div class="band"></div>
            <div class="head">
              <div class="logo"><img alt="" /></div>
              <div class="title"></div>
            </div>
            <div class="qrw"><img alt="" /></div>
            <div class="info">
              <div class="title2"></div>
              <div class="sub"></div>
              <div class="key"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="el ticker" data-el="ticker">
        <div class="scaler">
          <div class="box">
            <div class="logo"><img alt="" /></div>
            <div class="label"></div>
            <div class="track"><div class="run"></div></div>
            <div class="time"></div>
          </div>
        </div>
      </div>
      <div class="el agenda placed" data-el="agenda">
        <div class="scaler">
          <div class="box">
            <div class="head">
              <div class="logo"><img alt="" /></div>
              <div class="title"></div>
            </div>
            <div class="day">
              <div class="dname"></div>
              <div class="dlines"></div>
            </div>
            <div class="dots"></div>
          </div>
        </div>
      </div>
      <div class="el social placed" data-el="social">
        <div class="scaler">
          <div class="box">
            <div class="icon"></div>
            <div class="texts">
              <div class="prefix"></div>
              <div class="handle"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="el lower" data-el="lower">
        <div class="scaler">
          <div class="box">
            <div class="deco"></div>
            <div class="logo"><img alt="" /></div>
            <div class="texts">
              <div class="l1"><span></span></div>
              <div class="l2"><span></span></div>
            </div>
            <div class="qr"><img alt="" /></div>
            <div class="side"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
