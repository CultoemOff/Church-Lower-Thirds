<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lower Third Web — overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <div class="el top" data-el="top">
        <div class="scaler">
          <div class="box">
            <div class="brandp">
              <div class="logo"><img alt="" /></div>
              <div class="name"></div>
            </div>
            <div class="msgp">
              <div class="msg"><span></span></div>
            </div>
            <div class="clockp">
              <div class="time"></div>
              <div class="date"></div>
            </div>
            <div class="qr"><img alt="" /></div>
          </div>
        </div>
      </div>
      <div class="el bug" data-el="bug">
        <div class="scaler">
          <div class="box"><img alt="" /></div>
        </div>
      </div>
      <div class="el card" data-el="card">
        <div class="scaler">
          <div class="box">
            <div class="band"></div>
            <div class="head">
              <div class="logo"><img alt="" /></div>
              <div class="title"></div>
            </div>
            <div class="qrw"><img alt="" /></div>
            <div class="info">
              <div class="title2"></div>
              <div class="sub"></div>
              <div class="key"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="el lower" data-el="lower">
        <div class="scaler">
          <div class="box">
            <div class="deco"></div>
            <div class="logo"><img alt="" /></div>
            <div class="texts">
              <div class="l1"><span></span></div>
              <div class="l2"><span></span></div>
            </div>
            <div class="qr"><img alt="" /></div>
            <div class="side"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
