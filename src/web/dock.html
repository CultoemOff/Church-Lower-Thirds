<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Church Lower Thirds by Culto em Off</title>
    <link rel="stylesheet" href="/ui.css" />
    <link rel="stylesheet" href="/dock.css" />
    <link rel="icon" type="image/svg+xml" href="/icons/app.svg" />
  </head>
  <body>
    <main class="dock">
      <header>
        <div class="brand"><strong>CHURCH LOWER THIRDS</strong></div>
        <div class="headerActions">
          <select
            id="autoHide"
            class="timeSelect"
            title="Tempo na tela: quanto tempo nomes, redes sociais e comentários ficam antes de sair sozinhos. O cartão de ofertas não segue o tempo: fica até ser desligado."
          ></select
          ><button id="hideAll" class="iconBtn" title="Tirar tudo do ar">
            <img src="/icons/clear.svg" alt="" /></button
          ><button id="themeToggle" class="iconBtn" title="Tema claro / escuro">
            <img src="/icons/sun.svg" alt="" /></button
          ><button
            id="openSettings"
            class="iconBtn"
            title="Configurações avançadas: abre no navegador (modelos, cores, fontes, contribuições, logo)"
          >
            <img src="/icons/settings.svg" alt="" />
          </button>
        </div>
      </header>
      <nav id="tabs" class="tabs"></nav>
      <section class="panel tabPanel">
        <div class="paneBar">
          <button
            id="tabPin"
            class="iconBtn"
            title="Fixar: o que for mostrado nesta aba fica na tela até esconder, mesmo quando o tempo acabar"
          >
            <img src="/icons/pin.svg" alt="" />
          </button>
          <span id="paneState" class="paneState"><i></i><b></b></span>
          <button
            id="tabEye"
            class="switch"
            role="switch"
            aria-checked="false"
            title="Liga ou desliga na tela o elemento desta aba"
          >
            <i></i>
          </button>
        </div>
        <div id="pane" class="pane"></div>
      </section>
      <section id="profileBar" class="panel profileBar">
        <label for="profile">Perfil</label>
        <select
          id="profile"
          title="Perfil: troca de uma vez tudo o que é de uma igreja ou de um evento (nome, logo, aparência, nomes e textos). Crie e ajuste os perfis nas configurações."
        ></select>
      </section>
      <footer>
        <span>Desenvolvido por</span>
        <a href="https://www.youtube.com/@CultoemOff" target="_blank" rel="noopener noreferrer"
          >Culto em Off</a
        ><span id="appVersion" class="appVersion"></span>
      </footer>
    </main>
    <script type="module" src="/dock.js"></script>
  </body>
</html>
