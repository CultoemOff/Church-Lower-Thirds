name: Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build TypeScript
        run: npm run build
      - name: Prepare portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\app\dist\web | Out-Null
          New-Item -ItemType Directory -Force package\runtime | Out-Null
          Copy-Item -Recurse -Force dist\* package\app\dist\
          Copy-Item -Recurse -Force src\web\* package\app\dist\web\
          Copy-Item package.json, package-lock.json, LICENSE.txt package\app\
          Copy-Item scripts\windows\start-server.vbs, scripts\windows\open-settings.vbs, scripts\windows\run-setup.vbs, scripts\windows\stop-server.ps1 package\
          Copy-Item "$env:ProgramFiles\nodejs\node.exe" package\runtime\node.exe
          Push-Location package\app
          npm ci --omit=dev
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed in the package." }
          Pop-Location
          # The licenses of what the program is built with travel with it.
          node scripts\build-notices.mjs package\app package\app\THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw "Third-party notices were not written." }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # The license page of the setup: the same text, with the mark that makes Inno
          # Setup read it as UTF-8 (without it the accented letters come out wrong).
          New-Item -ItemType Directory -Force installer\output | Out-Null
          $license = [IO.File]::ReadAllText("$PWD\LICENSE.txt", [Text.Encoding]::UTF8)
          [IO.File]::WriteAllText("$PWD\installer\output\LICENSE-setup.txt", $license, (New-Object Text.UTF8Encoding $true))
          & $iscc "/DMyAppVersion=$version" installer\Church-Lower-Thirds.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Setup can be started by the program itself
        shell: pwsh
        run: |
          # The update button starts the installer from a program without administrator
          # rights; the installer then asks Windows for permission by itself.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('installer\output\Church-Lower-Thirds-Setup.exe'))
          $level = [regex]::Match($text, 'requestedExecutionLevel\s+level="(\w+)"').Groups[1].Value
          Write-Host "requestedExecutionLevel: $level"
          if ($level -ne 'asInvoker') { throw "The update button could not start this setup (manifest: '$level')" }
      - name: Installer test 1 of 5 - install
        shell: pwsh
        timeout-minutes: 10
        run: |
          . .github\scripts\installer-test.ps1
          $code = Run-Setup '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($code -ne 0) { throw "Installer exited with $code" }
          $expected = "$dir\runtime\node.exe", "$dir\app\dist\server\index.js", "$dir\app\dist\web\overlay.html",
            "$dir\app\LICENSE.txt", "$dir\app\THIRD-PARTY-NOTICES.txt",
            "$dir\start-server.vbs", "$dir\open-settings.vbs", "$dir\run-setup.vbs", "$dir\stop-server.ps1", "$dir\church-lower-thirds.ico"
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "Missing after install: $($missing -join ', ')" }
          if (-not (Test-Path $userKey)) { throw "Uninstall entry missing" }
          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').'Church Lower Thirds'
          if ($run -notlike '*Culto em Off\Church Lower Thirds\start-server.vbs*') { throw "Autostart entry is: $run" }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Church Lower Thirds.lnk'
          if (-not (Test-Path $lnk)) { throw "Desktop shortcut not created" }

          $note = Get-Content (Join-Path $env:ProgramData 'Culto em Off\Church Lower Thirds\install.json') -Raw | ConvertFrom-Json
          if (-not $note.language) { throw "install.json is wrong: $($note | ConvertTo-Json -Compress)" }
          # The installer starts the server by itself.
          $health = $null
          for ($i = 0; $i -lt 40 -and -not $health; $i++) {
            Start-Sleep -Milliseconds 500
            try { $health = Invoke-RestMethod "$base/api/health" } catch {}
          }
          if (-not $health) { throw "Installed server did not start" }
          if ($health.version -ne $version) { throw "Health returned $($health.version), expected $version" }
      - name: Installer test 2 of 5 - pages, settings and controls
        shell: pwsh
        timeout-minutes: 10
        run: |
          . .github\scripts\installer-test.ps1
          # The folder chosen in the installer (Documents by default) gets the settings and
          # the OBS source files, with the same English names on every computer.
          # The program answers as soon as it is listening and writes the source files right
          # after: "sourcesDir" appears when they are all there.
          $info = $null
          for ($i = 0; $i -lt 40 -and -not $info.sourcesDir; $i++) {
            if ($i) { Start-Sleep -Milliseconds 500 }
            $info = Invoke-RestMethod "$base/api/info"
          }
          if ($info.folder -ne $files) { throw "Files folder is $($info.folder), expected $files" }
          foreach ($f in 'Data\config.json', 'OBS Sources\All Elements.html', 'OBS Sources\Names.html', 'OBS Sources\Corner Badge.html',
            'OBS Sources\Ticker.html', 'OBS Sources\QR Card.html', 'OBS Sources\Schedule.html', 'OBS Sources\Social.html',
            'OBS Sources\Logo.html', 'OBS Sources\Names (Vertical).html', 'OBS Sources\Read me.txt') {
            if (-not (Test-Path (Join-Path $files $f))) { throw "Missing in the files folder: $f" }
          }
          if ((Get-Content (Join-Path $files 'OBS Sources\Names.html') -Raw) -notmatch '/source/names') { throw "Names.html does not open the names source" }
          foreach ($page in '/source/all', '/source/names', '/source/badge?layout=vertical') {
            $res = Invoke-WebRequest "$base$page" -UseBasicParsing
            if ($res.StatusCode -ne 200) { throw "$page did not load" }
          }
          foreach ($js in '/js/i18n.js', '/js/i18n/en.js', '/js/i18n/de.js') {
            $res = Invoke-WebRequest "$base$js" -UseBasicParsing
            if ($res.Headers['Content-Type'] -notmatch 'javascript') { throw "$js served as $($res.Headers['Content-Type'])" }
          }
          foreach ($page in '/dock', '/settings', '/overlay') {
            $res = Invoke-WebRequest "$base$page" -UseBasicParsing
            if ($res.StatusCode -ne 200 -or $res.Content -notmatch 'Church Lower Thirds') { throw "$page did not load" }
          }
          foreach ($js in '/dock.js', '/settings.js', '/overlay.js', '/js/common.js', '/js/look.js', '/js/models.js') {
            $res = Invoke-WebRequest "$base$js" -UseBasicParsing
            if ($res.Headers['Content-Type'] -notmatch 'javascript') { throw "$js served as $($res.Headers['Content-Type'])" }
          }
          # The license and the notices of the components, as the About page links them.
          $lic = Invoke-WebRequest "$base/license.txt" -UseBasicParsing
          if ($lic.Content -notmatch 'Culto em Off' -or $lic.Content -notmatch 'reverse engineer') { throw "The license is not served" }
          $notices = Invoke-WebRequest "$base/third-party-notices.txt" -UseBasicParsing
          if ($notices.Content -notmatch 'express@' -or $notices.Content -notmatch 'SIL OPEN FONT LICENSE') { throw "The third-party notices are not served" }
          if ($info.platform -ne 'win32') { throw "The program says it runs on '$($info.platform)'" }
          # The small pictures of the ready-made models are the overlay itself.
          $res = Invoke-WebRequest "$base/overlay?preview=model&model=easter" -UseBasicParsing
          if ($res.StatusCode -ne 200) { throw "Model picture did not load" }
          $font = Invoke-WebRequest "$base/fonts/fredoka-latin-wght-normal.woff2" -UseBasicParsing
          if ($font.StatusCode -ne 200 -or $font.RawContentLength -lt 5000) { throw "Fredoka font not served" }
          # Fonts shipped with the app.
          $font = Invoke-WebRequest "$base/fonts/outfit-latin-wght-normal.woff2" -UseBasicParsing
          if ($font.StatusCode -ne 200 -or $font.RawContentLength -lt 5000) { throw "Bundled font not served" }
          # The dock changes single values: time on screen, a name typed on the spot.
          $patch = @{ 'timing.autoHide' = 10; 'lower.quick' = @{ line1 = 'Visitante'; line2 = '' } } | ConvertTo-Json
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body $patch | Out-Null
          $quick = Invoke-RestMethod "$base/api/live/lower/show?item=quick" -Method Post
          if ($quick.live.lower.item -ne 'quick' -or -not $quick.live.lower.on) { throw "Quick name did not go on air" }
          foreach ($el in 'ticker', 'agenda', 'social') {
            $r = Invoke-RestMethod "$base/api/live/$el/show" -Method Post
            if (-not $r.live.$el.on) { throw "$el did not go on air" }
          }
          # Update check: answers from GitHub (or says it could not), never crashes the server.
          try { $u = Invoke-RestMethod "$base/api/update"; Write-Host "Update check: current $($u.current), latest $($u.latest), newer $($u.newer)" }
          catch { Write-Host "Update check not available yet: $($_.Exception.Message)" }
          # Settings round trip, PIX code and QR image.
          $state = Invoke-RestMethod "$base/api/state"
          # An English installation starts on "link", not on PIX: each language starts from
          # what its main country uses.
          if ($state.config.language -eq 'en' -and $state.config.giving.method -ne 'link') { throw "English first run started on $($state.config.giving.method)" }
          $state.config.giving.method = 'pix'
          $state.config.pix.key = '12.345.678/0001-90'
          $state.config.pix.name = 'Igreja Teste'
          $state.config.pix.city = 'Sao Paulo'
          Invoke-RestMethod "$base/api/config" -Method Put -ContentType 'application/json' -Body ($state.config | ConvertTo-Json -Depth 20) | Out-Null
          $pix = Invoke-RestMethod "$base/api/giving"
          if ($pix.payload -notmatch '^000201.*6304[0-9A-F]{4}$') { throw "Unexpected PIX code: $($pix.payload)" }
          $qr = Invoke-WebRequest "$base/api/qr.svg?kind=giving" -UseBasicParsing
          if ($qr.Headers['Content-Type'] -notmatch 'svg') { throw "QR served as $($qr.Headers['Content-Type'])" }
          # An offering with its own PIX key, and a comment typed by hand.
          $qr = Invoke-WebRequest "$base/api/qr.svg?kind=pixkey&text=missoes%40igreja.org" -UseBasicParsing
          if ($qr.Headers['Content-Type'] -notmatch 'svg') { throw "QR of another PIX key served as $($qr.Headers['Content-Type'])" }
          $patch = @{ 'comment.user' = '@maria'; 'comment.said' = 'Que culto abençoado!' } | ConvertTo-Json
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($patch)) | Out-Null
          $c = Invoke-RestMethod "$base/api/live/comment/show" -Method Post
          if (-not $c.live.comment.on) { throw "The comment did not go on air" }
          # The countdown and the order of service: one step, run with "next".
          $patch = @{ rundown = @(@{ id = 'step1111'; kind = 'countdown'; ref = ''; note = '' }); 'countdown.minutes' = 2 } | ConvertTo-Json -Depth 5
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body $patch | Out-Null
          $s = Invoke-RestMethod "$base/api/rundown/next"
          if ($s.live.step -ne 'step1111' -or -not $s.live.countdown.on -or $s.live.countdown.until -le 0) { throw "The order of service did not start the countdown: $($s | ConvertTo-Json -Compress -Depth 5)" }
          # With OBS closed, asking it to create the sources fails with a clear reason.
          try { Invoke-RestMethod "$base/api/obs/sources" -Method Post -ContentType 'application/json' -Body '{"port":4999}' | Out-Null; throw 'OBS answered where there is none' }
          catch { if ("$($_.ErrorDetails.Message)" -notmatch 'OBS is not answering') { throw "Unexpected answer about OBS: $($_.ErrorDetails.Message) $_" } }
          # Service profiles: a new one, back to the first by its name.
          $p = Invoke-RestMethod "$base/api/profile/add" -Method Post -ContentType 'application/json' -Body (@{ name = 'Natal' } | ConvertTo-Json)
          if ($p.config.profiles.Count -ne 2) { throw "Profile not created" }
          $p = Invoke-RestMethod "$base/api/profile/use?n=1"
          if ($p.profile -ne 'padrao') { throw "Profile not changed: $($p.profile)" }
          # PIX only exists in Brazil: the same QR from a SEPA transfer and from a link.
          $patch = @{ 'giving.method' = 'sepa'; 'giving.sepa.name' = 'Igreja Teste'; 'giving.sepa.iban' = 'PT50 0002 0123 1234 5678 9015 4' } | ConvertTo-Json
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body $patch | Out-Null
          $sepa = Invoke-RestMethod "$base/api/giving"
          if ($sepa.payload -notmatch "^BCD\n002\n1\nSCT\n\nIgreja Teste\nPT50000201231234567890154$") { throw "Unexpected SEPA code: $($sepa.payload)" }
          $patch = @{ 'giving.method' = 'link'; 'giving.link' = 'https://example.org/give' } | ConvertTo-Json
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body $patch | Out-Null
          if ((Invoke-RestMethod "$base/api/giving").payload -ne 'https://example.org/give') { throw "Link giving not served" }
          # The global theme and the setup assistant flag are part of the settings.
          $now = (Invoke-RestMethod "$base/api/state").config
          if (-not $now.theme.main.a -or $now.lower.custom -ne $false -or $now.setupDone -ne $false) { throw "Theme defaults missing: $($now.theme | ConvertTo-Json -Compress)" }
          # Installed fonts (PowerShell + System.Drawing on the user's machine).
          $fonts = Invoke-RestMethod "$base/api/fonts"
          if (@($fonts).Count -lt 5 -or 'Arial' -notin $fonts) { throw "Font list looks wrong: $(@($fonts).Count) fonts" }
          # On air: show the first name, then hide everything.
          $live = Invoke-RestMethod "$base/api/live/lower/show?item=1" -Method Post
          if (-not $live.live.lower.on) { throw "Lower third did not go on air" }
          $live = Invoke-RestMethod "$base/api/live/all/hide" -Method Post
          if ($live.live.lower.on) { throw "Hide all left the lower third on" }
          # Social: every item in sequence.
          $all = Invoke-RestMethod "$base/api/live/social/show?item=all" -Method Post
          if (-not $all.live.social.on -or $all.live.social.item -ne 'all') { throw "Social sequence did not start: $($all.live.social | ConvertTo-Json -Compress)" }
          Invoke-RestMethod "$base/api/live/social/hide" -Method Post | Out-Null
          # Pinned in the dock: the global time does not take it off the air.
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body (@{ 'timing.autoHide' = 2 } | ConvertTo-Json) | Out-Null
          Invoke-RestMethod "$base/api/live/lower/pin" -Method Post | Out-Null
          Invoke-RestMethod "$base/api/live/lower/show?item=1" -Method Post | Out-Null
          Start-Sleep -Seconds 4
          if (-not (Invoke-RestMethod "$base/api/state").live.lower.on) { throw "A pinned name left the screen by itself" }
          Invoke-RestMethod "$base/api/live/lower/unpin" -Method Post | Out-Null
          Start-Sleep -Seconds 4
          if ((Invoke-RestMethod "$base/api/state").live.lower.on) { throw "An unpinned name stayed after the time" }
          Invoke-RestMethod "$base/api/patch" -Method Post -ContentType 'application/json' -Body (@{ 'timing.autoHide' = 0 } | ConvertTo-Json) | Out-Null
          # A page from another site must not be able to send commands or read the settings:
          # by its origin, by a plain cross-site request, or through another host name.
          function Assert-Refused([string]$What, [hashtable]$Headers, [string]$Path, [string]$Method = 'Get') {
            try {
              Invoke-WebRequest "$base$Path" -Method $Method -Headers $Headers -UseBasicParsing | Out-Null
              $ok = $true
            } catch { $ok = $false }
            if ($ok) { throw "$What was accepted" }
          }
          Assert-Refused 'A foreign origin' @{ Origin = 'https://example.com' } '/api/live/top/show' 'Post'
          Assert-Refused 'A cross-site request' @{ 'Sec-Fetch-Site' = 'cross-site' } '/api/state'
          Assert-Refused 'Another host name' @{ Host = 'example.com:8795' } '/api/state'
          if ((Invoke-RestMethod "$base/api/state").live.top.on) { throw "A refused request still changed what is on air" }
          # An address that does not exist answers in JSON, without internals.
          try { Invoke-WebRequest "$base/api/nope" -UseBasicParsing | Out-Null; throw "Unknown address was accepted" }
          catch { if ($_.Exception.Message -match 'accepted') { throw } }
          Write-Host "Installed server v$version OK; fonts: $(@($fonts).Count)"
      - name: Installer test 3 of 5 - update over itself, change of folder
        shell: pwsh
        timeout-minutes: 10
        run: |
          . .github\scripts\installer-test.ps1
          # The one-click update runs this same installer with /SILENT: the program comes
          # back by itself, in the same folder, with the same settings.
          $code = Run-Setup '/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($code -ne 0) { throw "Update run exited with $code" }
          Wait-Server
          $after = Invoke-RestMethod "$base/api/info"
          if ($after.folder -ne $files) { throw "After the update the folder is $($after.folder)" }
          if ((Invoke-RestMethod "$base/api/state").config.pix.name -ne 'Igreja Teste') { throw "Settings lost by the update" }
          $mine = Get-Content (Join-Path $env:APPDATA 'Church Lower Thirds\location.json') -Raw | ConvertFrom-Json
          if ($mine.folder -ne $files -or $mine.port -ne 8795) { throw "location.json is wrong: $($mine | ConvertTo-Json -Compress)" }
          # Another folder chosen (accents included): the settings go along.
          $code = Run-Setup '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/FILES=`"$other`""
          if ($code -ne 0) { throw "Reinstall exited with $code" }
          Wait-Server
          $after = Invoke-RestMethod "$base/api/info"
          if ($after.folder -ne $other) { throw "Chosen folder not used: $($after.folder)" }
          if ((Invoke-RestMethod "$base/api/state").config.pix.name -ne 'Igreja Teste') { throw "Settings did not follow to the new folder" }
          if (-not (Test-Path (Join-Path $other 'OBS Sources\Names.html'))) { throw "OBS source files missing in the new folder" }
          Write-Host "Update and folder change keep the settings."
      - name: Installer test 4 of 5 - the update button, end to end
        shell: pwsh
        timeout-minutes: 18
        run: |
          . .github\scripts\installer-test.ps1
          # The "Update now" button, end to end: the program finds a newer release (a local
          # stand-in for GitHub offering this same installer as v99), downloads it, checks
          # the SHA-256, runs it, and comes back by itself.
          $rel = Join-Path $env:RUNNER_TEMP 'fake-release'
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item $exe (Join-Path $rel 'Church-Lower-Thirds-Setup-99.0.0.exe')
          $hash = (Get-FileHash (Join-Path $rel 'Church-Lower-Thirds-Setup-99.0.0.exe') -Algorithm SHA256).Hash.ToLower()
          Set-Content (Join-Path $rel 'SHA256SUMS.txt') "$hash *Church-Lower-Thirds-Setup-99.0.0.exe" -Encoding ascii
          $assets = @(
            @{ name = 'Church-Lower-Thirds-Setup-99.0.0.exe'; browser_download_url = 'http://127.0.0.1:8899/Church-Lower-Thirds-Setup-99.0.0.exe' },
            @{ name = 'SHA256SUMS.txt'; browser_download_url = 'http://127.0.0.1:8899/SHA256SUMS.txt' })
          ConvertTo-Json -Depth 5 @(@{ tag_name = 'v99.0.0'; html_url = 'http://127.0.0.1:8899/'; assets = $assets }) |
            Set-Content (Join-Path $rel 'releases.json') -Encoding utf8
          $web = Start-Process python -ArgumentList '-m', 'http.server', '8899', '--bind', '127.0.0.1' -WorkingDirectory $rel -PassThru -WindowStyle Hidden
          $listed = $null
          for ($i = 0; $i -lt 60 -and -not $listed; $i++) {
            Start-Sleep -Milliseconds 500
            try { $listed = Invoke-RestMethod 'http://127.0.0.1:8899/releases.json' } catch {}
          }
          if (-not $listed) { throw "The stand-in release server did not start" }
          $log = Join-Path $env:RUNNER_TEMP 'server'
          # The three ways of starting the installer: by the program itself; through
          # run-setup.vbs, what it does on a person's computer (here without the window that
          # waits for a click); and through the Windows shell with administrator rights, what
          # is left where that script cannot run.
          foreach ($launch in 'direct', 'script', 'shell') {
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\stop-server.ps1" -AppDir $dir
          $env:CLT_UPDATE_API = 'http://127.0.0.1:8899/releases.json'
          $env:CLT_UPDATE_LAUNCH = $launch
          $env:CLT_UPDATE_ASK = '0'
          # In a console of its own (cmd in a hidden window), as the installed program runs:
          # sharing the console of this step would let a Ctrl+C meant for it reach the runner.
          Start-Process cmd.exe -ArgumentList '/c', "`"`"$dir\runtime\node.exe`" `"$dir\app\dist\server\index.js`" > `"$log.out.txt`" 2> `"$log.err.txt`"`"" -WorkingDirectory "$dir\app" -WindowStyle Hidden
          $env:CLT_UPDATE_API = $null
          $env:CLT_UPDATE_LAUNCH = $null
          $env:CLT_UPDATE_ASK = $null
          Wait-Server
          $node = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -eq "$dir\runtime\node.exe" } | Select-Object -First 1
          if (-not $node) { throw "The test server is not running from the installed folder" }
          $old = Get-Process -Id $node.ProcessId
          $u = Invoke-RestMethod "$base/api/update?force=1"
          if (-not $u.newer -or $u.latest -ne '99.0.0' -or -not $u.canInstall) { throw "Update not offered: $($u | ConvertTo-Json -Compress)" }
          try { $r = Invoke-RestMethod "$base/api/update/install" -Method Post -TimeoutSec 120 }
          catch {
            Start-Sleep -Seconds 2
            Get-Content "$log.out.txt", "$log.err.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  server: $_" }
            throw
          }
          if (-not $r.ok -or $r.how -ne $launch) { throw "Update did not start as '$launch': $($r | ConvertTo-Json -Compress)" }
          if (-not $old.WaitForExit(180000)) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Setup|powershell|wscript|_iu|\.tmp$' } |
              ForEach-Object { Write-Host "  running: $($_.Name) $($_.CommandLine)" }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*.txt' | Sort-Object LastWriteTime | Select-Object -Last 1 |
              ForEach-Object { Write-Host "  --- $($_.Name)"; Get-Content $_.FullName | Select-Object -Last 60 | ForEach-Object { Write-Host "  setup: $_" } }
            Get-Content "$log.out.txt", "$log.err.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  server: $_" }
            throw "The installer never stopped the running program"
          }
          Wait-Server
          for ($i = 0; $i -lt 120 -and (Get-Process -Name 'Church-Lower-Thirds-Setup*' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          Wait-Server
          if ((Invoke-RestMethod "$base/api/info").folder -ne $other) { throw "Folder changed by the in-app update" }
          if ((Invoke-RestMethod "$base/api/state").config.pix.name -ne 'Igreja Teste') { throw "Settings lost by the in-app update" }
          # The installer the program downloaded is its own to remove once the version runs.
          $kept = Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads'), $env:TEMP -Filter 'Church-Lower-Thirds-Setup-99.0.0.exe' -ErrorAction SilentlyContinue
          Write-Host "In-app update ($launch): downloaded, verified, installed and back on air. Installer left behind: $(@($kept).Count)"
          }
          Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
      - name: Installer test 5 of 5 - uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          . .github\scripts\installer-test.ps1
          # The uninstaller hands the work to a copy of itself and leaves: wait for the result,
          # not for the process.
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 240 -and ((Test-Path "$dir\runtime\node.exe") -or (Test-Path $userKey)); $i++) { Start-Sleep -Milliseconds 500 }
          foreach ($f in "$dir\runtime\node.exe", $userKey) {
            if (Test-Path $f) { throw "Left behind after uninstall: $f" }
          }
          try { Invoke-RestMethod "$base/api/health" -TimeoutSec 2 | Out-Null; throw "Server still running after uninstall" } catch { if ($_.Exception.Message -match 'still running') { throw } }
          Write-Host "Uninstall removed the app and stopped the server."
      - name: Name the installer after its version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Move-Item installer\output\Church-Lower-Thirds-Setup.exe "installer\output\Church-Lower-Thirds-Setup-$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Church-Lower-Thirds-Setup
          path: installer/output/Church-Lower-Thirds-Setup-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build TypeScript
        run: npm run build
      - name: Universal Node.js runtime
        run: |
          v=$(node -p process.version)
          dl="$RUNNER_TEMP/node"
          mkdir -p "$dl" stage/runtime
          curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o "$dl/SHASUMS256.txt"
          for a in arm64 x64; do
            f="node-$v-darwin-$a.tar.gz"
            curl -fsSL "https://nodejs.org/dist/$v/$f" -o "$dl/$f"
            (cd "$dl" && grep " $f\$" SHASUMS256.txt | shasum -a 256 -c -)
            tar -xzf "$dl/$f" -C "$dl"
          done
          lipo -create "$dl/node-$v-darwin-arm64/bin/node" "$dl/node-$v-darwin-x64/bin/node" -output stage/runtime/node
          lipo -archs stage/runtime/node
          # Each slice keeps the Node.js project's own signature.
          codesign --verify --verbose stage/runtime/node
          stage/runtime/node -v
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            /usr/bin/arch -x86_64 stage/runtime/node -p "process.arch + ' ' + process.version"
          else
            echo "Rosetta is not available on this runner; skipping the x86_64 run."
          fi
      - name: Prepare application
        run: |
          mkdir -p stage/app/dist/web
          cp -R dist/* stage/app/dist/
          cp -R src/web/* stage/app/dist/web/
          cp package.json package-lock.json LICENSE.txt stage/app/
          (cd stage/app && npm ci --omit=dev)
          node scripts/build-notices.mjs stage/app stage/app/THIRD-PARTY-NOTICES.txt
      - name: Build package
        run: |
          version=$(node -p "require('./package.json').version")
          installer/macos/build-pkg.sh "$version" stage "installer/output/Church-Lower-Thirds-macOS-$version.pkg"
      - name: Package test 1 of 3 - install, pages and files
        run: |
          version=$(node -p "require('./package.json').version")
          app="/Applications/Church Lower Thirds.app"
          res="$app/Contents/Resources"
          agent="$HOME/Library/LaunchAgents/com.cultoemoff.churchlowerthirds.plist"
          data="$HOME/Library/Application Support/Church Lower Thirds"
          base=http://127.0.0.1:8795
          sudo installer -pkg "installer/output/Church-Lower-Thirds-macOS-$version.pkg" -target /
          for f in "$res/runtime/node" "$res/app/dist/server/index.js" "$res/app/dist/web/overlay.html" \
            "$res/app/LICENSE.txt" "$res/app/THIRD-PARTY-NOTICES.txt" "$app/Contents/MacOS/Church Lower Thirds" \
            "$res/church-lower-thirds.icns" "$res/run-server.sh" "$res/uninstall.sh" "$res/launchagent.plist" \
            "$agent" "$data/install.json"; do
            [ -e "$f" ] || { echo "Missing after install: $f"; exit 1; }
          done
          plutil -lint "$agent" "$app/Contents/Info.plist"
          bash -n "$app/Contents/MacOS/Church Lower Thirds"
          bash -n "$res/run-server.sh"
          echo "install.json: $(cat "$data/install.json")"
          grep -Eq '"language":"(pt-BR|pt-PT|es|en|it|de)"' "$data/install.json"
          # launchd starts the server right after the install.
          health=""
          for _ in $(seq 1 60); do health=$(curl -fs $base/api/health) && break; sleep 0.5; done
          echo "health: $health"
          [[ "$health" == *"\"version\":\"$version\""* ]] || { launchctl print "gui/$(id -u)/com.cultoemoff.churchlowerthirds" || true; cat "$HOME/Library/Logs/Church Lower Thirds/server.log" || true; exit 1; }
          # The person's files: in Movies (Documents is guarded on a Mac), with the OBS sources.
          info=""
          for _ in $(seq 1 40); do info=$(curl -fs $base/api/info); [[ "$info" == *'"sourcesDir":"/'* ]] && break; sleep 0.5; done
          echo "info: $info"
          files="$HOME/Movies/Church Lower Thirds"
          node -e "const i = JSON.parse(process.argv[1]); if (i.platform !== 'darwin' || i.folder !== process.argv[2]) { console.error('Unexpected platform or folder', i.platform, i.folder); process.exit(1) }" "$info" "$files"
          for f in "Data/config.json" "OBS Sources/All Elements.html" "OBS Sources/Names.html" "OBS Sources/Names (Vertical).html" "OBS Sources/Control Dock.html" "OBS Sources/Read me.txt"; do
            [ -f "$files/$f" ] || { echo "Missing in the files folder: $f"; exit 1; }
          done
          grep -q '/source/names' "$files/OBS Sources/Names.html"
          grep -q '"port":8795' "$data/location.json"
          for page in /dock /settings /overlay /source/all "/source/badge?layout=vertical"; do
            curl -fs "$base$page" | grep -q 'Church Lower Thirds' || { echo "$page did not load"; exit 1; }
          done
          for js in /dock.js /settings.js /overlay.js /js/common.js /js/i18n/en.js; do
            curl -fsI "$base$js" | grep -qi '^content-type: .*javascript' || { echo "$js not served as JavaScript"; exit 1; }
          done
          curl -fs $base/license.txt | grep -q 'reverse engineer'
          curl -fs $base/third-party-notices.txt | grep -q 'express@'
          curl -fs "$base/fonts/outfit-latin-wght-normal.woff2" -o "$RUNNER_TEMP/font.woff2"
          [ "$(stat -f%z "$RUNNER_TEMP/font.woff2")" -gt 5000 ]
          # The fonts installed on the Mac (CoreText, through osascript).
          fonts=$(curl -fs $base/api/fonts)
          node -e "const f = JSON.parse(process.argv[1]); console.log('fonts:', f.length); if (f.length < 5 || !f.includes('Helvetica')) { console.error(f.slice(0, 20)); process.exit(1) }" "$fonts"
          # On air and off again; a QR code; a page from another site is refused.
          shown=$(curl -fs -X POST "$base/api/live/lower/show?item=1")
          node -e "if (!JSON.parse(process.argv[1]).live.lower.on) { console.error('The name did not go on air'); process.exit(1) }" "$shown"
          curl -fs -X POST "$base/api/live/all/hide" > /dev/null
          curl -fsI "$base/api/qr.svg?kind=giving" | grep -qi '^content-type: .*svg'
          if curl -fs -X POST -H 'Origin: https://example.com' "$base/api/live/top/show" > /dev/null; then echo "A foreign origin was accepted"; exit 1; fi
          echo "Installed server v$version OK on macOS."
      - name: Package test 2 of 3 - the update check and download
        run: |
          version=$(node -p "require('./package.json').version")
          res="/Applications/Church Lower Thirds.app/Contents/Resources"
          # A local stand-in for GitHub offers this same package as v99: the program must
          # pick the macOS package (not the Windows setup), download it and check its SHA-256.
          rel="$RUNNER_TEMP/fake-release"
          mkdir -p "$rel"
          cp "installer/output/Church-Lower-Thirds-macOS-$version.pkg" "$rel/Church-Lower-Thirds-macOS-99.0.0.pkg"
          echo "not the installer of this system" > "$rel/Church-Lower-Thirds-Setup-99.0.0.exe"
          (cd "$rel" && shasum -a 256 Church-Lower-Thirds-macOS-99.0.0.pkg Church-Lower-Thirds-Setup-99.0.0.exe | sed 's/  / */' > SHA256SUMS.txt)
          cat > "$rel/releases.json" <<JSON
          [{"tag_name":"v99.0.0","html_url":"http://127.0.0.1:8899/","assets":[
            {"name":"Church-Lower-Thirds-Setup-99.0.0.exe","browser_download_url":"http://127.0.0.1:8899/Church-Lower-Thirds-Setup-99.0.0.exe"},
            {"name":"Church-Lower-Thirds-macOS-99.0.0.pkg","browser_download_url":"http://127.0.0.1:8899/Church-Lower-Thirds-macOS-99.0.0.pkg"},
            {"name":"SHA256SUMS.txt","browser_download_url":"http://127.0.0.1:8899/SHA256SUMS.txt"}]}]
          JSON
          (cd "$rel" && python3 -m http.server 8899 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 1 40); do curl -fs http://127.0.0.1:8899/releases.json > /dev/null && break; sleep 0.25; done
          # A second copy of the installed program, on its own port and folder, told where
          # the releases are; "none" keeps it from opening the Installer window on the runner.
          (cd "$res/app" && CLT_UPDATE_API=http://127.0.0.1:8899/releases.json CLT_UPDATE_LAUNCH=none \
            CLT_DATA_DIR="$RUNNER_TEMP/clt-data" PORT=8797 "$res/runtime/node" dist/server/index.js > "$RUNNER_TEMP/second.log" 2>&1 &)
          base=http://127.0.0.1:8797
          for _ in $(seq 1 60); do curl -fs $base/api/health > /dev/null && break; sleep 0.5; done
          u=$(curl -fs "$base/api/update?force=1")
          echo "update: $u"
          node -e "const u = JSON.parse(process.argv[1]); if (!u.newer || u.latest !== '99.0.0' || !u.canInstall || u.setupName !== 'Church-Lower-Thirds-macOS-99.0.0.pkg') process.exit(1)" "$u"
          r=$(curl -fs -X POST -H 'content-type: application/json' -d '{}' "$base/api/update/install") || { cat "$RUNNER_TEMP/second.log"; exit 1; }
          echo "install: $r"
          [[ "$r" == *'"ok":true'* && "$r" == *'"how":"none"'* ]]
          got="$HOME/Library/Caches/Church Lower Thirds/Church-Lower-Thirds-macOS-99.0.0.pkg"
          cmp "$got" "$rel/Church-Lower-Thirds-macOS-99.0.0.pkg"
          pkgutil --check-signature "$got" || true
          pkill -f "http.server 8899" || true
          pkill -f "PORT=8797" || true
          kill "$(lsof -ti tcp:8797)" 2>/dev/null || true
          rm -f "$got"
          echo "Update on macOS: the right package offered, downloaded and verified."
      - name: Package test 3 of 3 - restart after a crash, uninstall
        run: |
          app="/Applications/Church Lower Thirds.app"
          res="$app/Contents/Resources"
          agent="$HOME/Library/LaunchAgents/com.cultoemoff.churchlowerthirds.plist"
          base=http://127.0.0.1:8795
          # launchd restarts the server if it crashes.
          pid=$(pgrep -f "$res/app/dist/server/index.js" | head -1)
          kill -9 "$pid"
          health=""
          for _ in $(seq 1 60); do sleep 0.5; health=$(curl -fs $base/api/health) && break; done
          [ -n "$health" ] || { echo "Server was not restarted by launchd"; exit 1; }
          # Installing over itself (what an update does) keeps the settings.
          curl -fs -X POST -H 'content-type: application/json' -d '{"brand.name":"Igreja Teste"}' $base/api/patch > /dev/null
          version=$(node -p "require('./package.json').version")
          sudo installer -pkg "installer/output/Church-Lower-Thirds-macOS-$version.pkg" -target /
          health=""
          for _ in $(seq 1 60); do sleep 0.5; health=$(curl -fs $base/api/health) && break; done
          [ -n "$health" ] || { echo "Server did not come back after installing over itself"; exit 1; }
          curl -fs $base/api/state | grep -q '"name":"Igreja Teste"' || { echo "Settings lost by installing over itself"; exit 1; }
          sudo "$res/uninstall.sh"
          sleep 2
          if curl -fs $base/api/health; then echo "Server still running after uninstall"; exit 1; fi
          for f in "$app" "$agent"; do
            [ ! -e "$f" ] || { echo "Left behind after uninstall: $f"; exit 1; }
          done
          [ -f "$HOME/Movies/Church Lower Thirds/Data/config.json" ] || { echo "The person's settings were removed by the uninstall"; exit 1; }
          echo "Restarted by launchd after a crash; update keeps the settings; uninstall removes the app and leaves the person's files."
      - uses: actions/upload-artifact@v4
        with:
          name: Church-Lower-Thirds-macOS
          path: installer/output/Church-Lower-Thirds-macOS-*.pkg
          if-no-files-found: error

  # main publishes every version twice: in this repository, and in the public downloads
  # repository (installers only), which is where the program looks for updates. Versions
  # like 1.1.0-beta.1 are pre-releases.
  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Church-Lower-Thirds-Setup
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: Church-Lower-Thirds-macOS
          path: out
      - name: Checksums for both installers
        run: |
          cd out
          # One line per installer; the program looks up its own file by name.
          sha256sum -b Church-Lower-Thirds-Setup-*.exe Church-Lower-Thirds-macOS-*.pkg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          [ "$(wc -l < SHA256SUMS.txt)" -eq 2 ]
      - name: Publish release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          flags=()
          title="Church Lower Thirds v$version"
          case "$version" in *-*) flags+=(--prerelease); title="$title (beta)" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file installer/RELEASE-NOTES.md "${flags[@]}"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file installer/RELEASE-NOTES.md "${flags[@]}"
          fi
          gh release upload "$tag" out/*.exe out/*.pkg out/SHA256SUMS.txt --clobber
      - name: Keep the page of the downloads repository up to date
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not configured: the downloads repository was not updated."
            exit 0
          fi
          # Its README, the license and the pictures are the ones kept here. First, so that
          # a repository still empty has a commit for the release to point at.
          repo="CultoemOff/Church-Lower-Thirds-Releases"
          version=$(node -p "require('./package.json').version")
          src="$PWD"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "$RUNNER_TEMP/pub"
          cd "$RUNNER_TEMP/pub"
          mkdir -p docs/media
          cp "$src/README.md" "$src/README.en.md" "$src/LICENSE.txt" .
          rsync -a --delete "$src/docs/media/" docs/media/
          git add -A
          if git diff --cached --quiet; then
            echo "The page is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Church Lower Thirds v$version"
          git push -q origin HEAD:main
      - name: Publish release in the public downloads repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not configured: nothing was published in the downloads repository."
            exit 0
          fi
          repo="CultoemOff/Church-Lower-Thirds-Releases"
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          flags=()
          title="Church Lower Thirds v$version"
          case "$version" in *-*) flags+=(--prerelease); title="$title (beta)" ;; esac
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title "$title" --notes-file installer/RELEASE-NOTES.md "${flags[@]}"
          else
            gh release create "$tag" --repo "$repo" --title "$title" --notes-file installer/RELEASE-NOTES.md "${flags[@]}"
          fi
          gh release upload "$tag" out/*.exe out/*.pkg out/SHA256SUMS.txt --repo "$repo" --clobber
